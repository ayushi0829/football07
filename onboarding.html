<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIDOLS Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0F0A;
  --accent: #00E676;
  --accent-soft: rgba(0, 230, 118, 0.6);
  --card: rgba(17, 25, 17, 0.6);
  --glass-bg: rgba(255, 255, 255, 0.05);
  --border-soft: rgba(0, 230, 118, 0.2);
  --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-hover: 0 16px 48px rgba(0, 230, 118, 0.2);
--radius: 12px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: linear-gradient(135deg, var(--bg) 0%, #0f1a12 100%);
  color: white;
  padding: clamp(16px, 3vw, 24px);
  min-height: 100vh;
  line-height: 1.5;
  backdrop-filter: blur(20px);
}

/* Progress Bar */
.progress-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: rgba(10, 15, 10, 0.95);
  backdrop-filter: blur(20px);
  padding: 16px;
  z-index: 100;
  border-bottom: 1px solid var(--border-soft);
  box-shadow: var(--shadow-soft);
}

.progress-bar {
  display: flex;
  justify-content: space-between;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
  background: rgba(34, 34, 34, 0.5);
}

.progress-fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-soft));
  transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  box-shadow: 0 0 12px var(--accent-soft);
  border-radius: 2px;
}

.progress-steps {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  transform: translateY(-50%);
}

.progress-step {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(10, 15, 10, 0.9);
  border: 2px solid var(--border-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  backdrop-filter: blur(10px);
}

.progress-step:hover {
  transform: scale(1.1);
  box-shadow: 0 0 16px var(--accent-soft);
}

.progress-step.active, .progress-step.completed {
  border-color: var(--accent);
  background: var(--accent);
  color: #000;
  font-weight: 800;
  font-size: 13px;
  text-shadow: none;
  box-shadow: 0 0 16px var(--accent-soft);
}

.container {
  max-width: 1000px;
  margin: auto;
  padding-top: 100px;
}

/* Steps */
.step {
  display: none;
  animation: fadeSlideIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  padding: 0 8px;
}

.step.active {
  display: block;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeSlideOut {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-30px); }
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px, 6vw, 52px);
  letter-spacing: 1.5px;
  margin: 0 0 16px 0;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
  position: relative;
}

h1::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 0;
  width: 80px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  border-radius: 1px;
  box-shadow: 0 0 8px var(--accent-soft);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  margin: 16px 0;
}

/* Cards */
.card {
  padding: 12px;
  border: 1px solid var(--border-soft);
  background: linear-gradient(145deg, var(--glass-bg), rgba(0,230,118,0.08));
  backdrop-filter: blur(20px);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  font-weight: 500;
  text-align: center;
  transform-style: preserve-3d;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transition: left 0.6s;
}

.card:hover {
  transform: translateY(-8px) scale(1.02);
  border-color: var(--accent-soft);
  box-shadow: var(--shadow-hover), 0 0 32px var(--accent-soft);
}

.card:hover::before {
  left: 100%;
}

.card.selected {
  border-color: var(--accent);
  background: linear-gradient(145deg, rgba(0,230,118,0.2), rgba(0,230,118,0.1));
  box-shadow: 0 0 32px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,0.2);
  transform: translateY(-4px);
}

/* Icon Cards */
.icon-card {
  height: 140px;
  perspective: 1000px;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  transform-style: preserve-3d;
  border-radius: var(--radius);
}

.icon-card.selected .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-soft);
}

.card-front strong {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
}

.role {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.8);
  font-weight: 400;
}

.card-back {
  transform: rotateY(180deg);
  background: var(--glass-bg);
  border-color: var(--accent-soft);
  font-style: italic;
  font-size: 15px;
  line-height: 1.4;
  text-align: center;
}

/* SVG Zones */
.zone {
  fill: rgba(17, 25, 17, 0.8);
  stroke: var(--border-soft);
  stroke-width: 2;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  rx: 8px;
}

.zone:hover {
  fill: rgba(26, 42, 31, 0.9);
  stroke: var(--accent-soft);
  stroke-width: 3;
  filter: drop-shadow(0 4px 12px var(--accent-soft));
}

.zone.active {
  fill: var(--accent-soft);
  stroke: var(--accent);
  stroke-width: 3;
  filter: drop-shadow(0 0 20px var(--accent-soft));
  transform: scale(1.05);
}

/* Search Input */
#search {
  width: 100%;
  max-width: 400px;
  padding: 16px 20px;
  background: var(--glass-bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  color: white;
  font-size: 16px;
  font-family: inherit;
  backdrop-filter: blur(20px);
  transition: all 0.3s ease;
  margin-bottom: 24px;
  box-shadow: var(--shadow-soft);
}

#search::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

#search:focus {
  outline: none;
  border-color: var(--accent-soft);
  box-shadow: 0 0 0 3px rgba(0,230,118,0.2), var(--shadow-hover);
}

/* Slider */
#eraSlider {
  width: 100%;
  height: 8px;
  background: rgba(34, 34, 34, 0.6);
  border-radius: 4px;
  outline: none;
  appearance: none;
  backdrop-filter: blur(10px);
  margin: 20px 0;
}

#eraSlider::-webkit-slider-thumb {
  appearance: none;
  width: 24px;
  height: 24px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: var(--shadow-soft), 0 0 16px var(--accent-soft);
  transition: all 0.3s ease;
}

#eraSlider::-webkit-slider-thumb:hover {
  transform: scale(1.2);
  box-shadow: var(--shadow-hover), 0 0 24px var(--accent);
}

#eraText {
  font-size: 24px;
  font-weight: 500;
  margin-top: 16px;
  text-align: center;
  color: var(--accent-soft);
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

/* Toggles */
.toggle {
  border: 1px solid var(--border-soft);
  padding: 12px 20px;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all 0.3s ease;
  margin: 8px 12px 8px 0;
  backdrop-filter: blur(10px);
  background: var(--glass-bg);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  box-shadow: var(--shadow-soft);
}

.toggle:hover {
  border-color: var(--accent-soft);
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

.toggle.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  box-shadow: 0 0 20px var(--accent-soft);
  transform: translateY(-2px);
}

/* Badges */
.badges {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px 0;
}

.badge {
  background: var(--card);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.3s ease;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-soft);
}

.badge:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(0, 230, 118, 0.3);
}

/* Buttons */
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  box-shadow: var(--shadow-soft);
  font-family: inherit;
  text-transform: uppercase;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
  margin: 4px;
  min-width: 120px;
  backdrop-filter: blur(10px);
}

button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.6s;
}

button:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 16px 48px rgba(0, 230, 118, 0.4), 0 0 32px var(--accent-soft);
}

button:hover::before {
  left: 100%;
}

button:active {
  transform: translateY(-2px) scale(1.01);
}

/* Era Visuals */
body.era-old {
  background: linear-gradient(135deg, #2a1f15 0%, #3e2d21 100%);
  filter: sepia(0.1) contrast(1.1);
}

body.era-mid {
  background: linear-gradient(135deg, var(--bg) 0%, #0f1a12 100%);
}

body.era-modern {
  background: linear-gradient(135deg, var(--bg) 0%, #0a1f0f 100%);
  filter: contrast(1.05) brightness(1.02);
}
</style>
</head>
<body>

      <rect class="zone" data-pos="RW" x="235" y="110" width="60" height="45" rx="8"/>

      <rect class="zone" data-pos="ST" x="130" y="90" width="80" height="45" rx="8"/>
      <text x="170" y="115" text-anchor="middle" fill="white" font-weight="bold" font-size="16">⚽ ST</text>
    </svg>
  </div>
  
  <div id="selectedPosition" style="margin-bottom:24px;font-size:18px;color:var(--accent-soft);"></div>
  
  <div style="margin-bottom:24px;">
    <h3 style="margin:0 0 16px 0;color:rgba(255,255,255,0.9);">Skill Level</h3>
    <div id="skills" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
  </div>
  
  <button onclick="goToStep(2)">Back</button>
  <button onclick="goToStep(4)">Next</button>
</div>


<div id="step4" class="step">
  <h1>Your Era</h1>
  
  <div style="max-width:500px;margin:0 auto 40px;">
    <div style="display:flex;justify-content:space-between;margin-bottom:20px;font-size:14px;color:rgba(255,255,255,0.8);">
      <span>1970s</span><span>1990s</span><span>2010s</span><span>2020s</span>
    </div>
    <input type="range" id="eraSlider" min="1970" max="2020" step="10" value="2000">
    <div id="eraText" style="text-align:center;font-size:28px;font-weight:500;color:var(--accent-soft);margin-top:16px;">2000s</div>
  </div>
  
  <h3 style="margin:40px 0 24px 0;">Pick up to 2 styles of play</h3>
  <div id="styles" class="grid"></div>
  
  <button onclick="goToStep(3)">Back</button>
  <button onclick="goToStep(5)">Next</button>
</div>


<div id="step5" class="step">
  <h1>Your AIDOLS</h1>
  
  <div id="persona" style="margin-bottom:32px;"></div>
  <div id="summary" style="margin-bottom:32px;"></div>
  
  <h3 style="margin:40px 0 24px 0;">Your Top Matches</h3>
  <div id="results" class="grid"></div>
  
  <button style="margin-top:40px;">Start Talking</button>
  <button onclick="goToStep(4)">Back</button>
</div>
</div>

// ===== STATE =====
const state = {
  clubs: [],
  icons: [],
  playStatus: "",
  position: "",
  skill: "",
  era: 2000,
  styles: []
};

// ===== DATA ===== (exactly as spec)
const clubs = [
  {name:"Barcelona", color:"#004D98"},

  {name:"Napoli", color:"#008CFF"},
  {name:"Roma", color:"#8E1F2F"},
  {name:"Sevilla", color:"#C8102E"},
  {name:"Atletico Madrid", color:"#CB3524"},
  {name:"Lyon", color:"#1D41A9"}
];

const icons = [
  {name: "Messi", role: "Forward", tagline: "Creative genius"},
  {name: "Ronaldo", role: "Forward", tagline: "Relentless machine"},
  {name: "Guardiola", role: "Coach", tagline: "Tactical mastermind"},
  {name: "Klopp", role: "Coach", tagline: "Intensity king"},
  {name: "Zidane", role: "Midfielder", tagline: "Elegant controller"},
  {name: "Xavi", role: "Midfielder", tagline: "Tempo dictator"},
  {name: "Iniesta", role: "Midfielder", tagline: "Silent magician"},
  {name: "Mbappe", role: "Forward", tagline: "Explosive speedster"},
  {name: "Haaland", role: "Striker", tagline: "Goal machine"},
  {name: "De Bruyne", role: "Midfielder", tagline: "Creative engine"},
  {name: "Ramos", role: "Defender", tagline: "Warrior leader"},
  {name: "Henry", role: "Forward", tagline: "Elegant finisher"}
];

const playStyles = [
  "Tiki-taka", "Counter-attack", "High press", "Total football", 
  "Route one", "Gegenpressing", "Catenaccio"
];

const avatars = [
  {name:"Guardiola",type:"coach",clubs:["Barcelona","Man City"],positions:["CM"],styles:["Tiki-taka"]},
  {name:"Klopp",type:"coach",clubs:["Liverpool"],styles:["Gegenpressing"]},
  {name:"Xavi",type:"player",clubs:["Barcelona"],positions:["CM"],styles:["Tiki-taka"]},
  {name:"Henry",type:"player",clubs:["Arsenal"],positions:["ST"],styles:["Counter-attack"]},
  {name:"Ramos",type:"player",clubs:["Real Madrid"],positions:["CB"],styles:["High press"]},
  {name:"Neuer",type:"player",clubs:["Bayern Munich"],positions:["GK"],styles:["High press"]},
  {name:"Buffon",type:"player",clubs:["Juventus"],positions:["GK"],styles:["Catenaccio"]},
  {name:"Iniesta",type:"player",clubs:["Barcelona"],positions:["CM"],styles:["Tiki-taka"]},
  {name:"Zidane",type:"player",clubs:["Real Madrid"],positions:["CAM"],styles:["Counter-attack"]},
  {name:"Haaland",type:"player",clubs:["Man City","Dortmund"],positions:["ST"],styles:["Counter-attack"]},
  {name:"De Bruyne",type:"player",clubs:["Man City"],positions:["CAM"],styles:["Tiki-taka"]},
  {name:"Messi",type:"player",clubs:["Barcelona","PSG"],positions:["CAM","ST"],styles:["Tiki-taka"]},
  {name:"Salah",type:"player",clubs:["Liverpool"],positions:["RW","ST"],styles:["Counter-attack"]},
  {name:"Van Dijk",type:"player",clubs:["Liverpool"],positions:["CB"],styles:["Gegenpressing"]},
  {name:"Alisson",type:"player",clubs:["Liverpool"],positions:["GK"],styles:["Gegenpressing"]},
  {name:"Courtois",type:"player",clubs:["Real Madrid"],positions:["GK"],styles:["Route one"]}
];

// ===== NAVIGATION =====
let currentStep = 1;

function updateProgress(step) {
  const fill = document.getElementById('progressFill');
  const steps = document.querySelectorAll('.progress-step');
  
  fill.style.width = ((step - 1) / 4 * 100) + '%';
  
  steps.forEach((s, i) => {
    s.classList.remove('active', 'completed');
    if (i + 1 < step) {
      s.classList.add('completed');
      s.textContent = '✓';
    } else if (i + 1 === step) {
      s.classList.add('active');
      s.textContent = step;
    }
  });
}

function goToStep(stepNum, direction = 1) {
  document.querySelector('.step.active').classList.remove('active');
  document.getElementById(`step${stepNum}`).classList.add('active');
  currentStep = stepNum;
  updateProgress(stepNum);
  
  if (stepNum === 5) {
    renderResults();
    renderSummary();
    renderPersona();
  }
}

// ===== STEP 1: CLUBS =====
function renderClubs(filteredClubs = clubs) {
  const grid = document.getElementById('clubsGrid');
  grid.innerHTML = '';
  
  filteredClubs.forEach(club => {
    const card = document.createElement('div');
    card.className = 'card';
    card.textContent = club.name;
    
    if (state.clubs.includes(club.name)) {
      card.classList.add('selected');
      card.style.borderColor = club.color;
    }
    
    card.addEventListener('click', () => {
      if (state.clubs.includes(club.name)) {
        state.clubs = state.clubs.filter(c => c !== club.name);
      } else if (state.clubs.length < 3) {
        state.clubs.push(club.name);
      }
      update();
    });
    
    grid.appendChild(card);
  });
}

function renderClubBadges() {
  const container = document.getElementById('badges');
  container.innerHTML = '';
  
  state.clubs.forEach(clubName => {
    const club = clubs.find(c => c.name === clubName);
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.style.background = club.color;
    badge.innerHTML = `${club.name} <span style="margin-left:8px;font-size:16px;">×</span>`;
    
    badge.addEventListener('click', (e) => {
      e.stopPropagation();
      state.clubs = state.clubs.filter(c => c !== clubName);
      update();
    });
    
    container.appendChild(badge);
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  const filtered = clubs.filter(c => c.name.toLowerCase().includes(query));
  renderClubs(filtered);
});

// ===== STEP 2: ICONS =====
function renderIcons() {
  const grid = document.getElementById('iconsGrid');
  grid.innerHTML = '';
  
  icons.forEach(icon => {
    const card = document.createElement('div');
    card.className = `icon-card ${state.icons.includes(icon.name) ? 'selected' : ''}`;
    
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          <strong>${icon.name}</strong>
          <div class="role">${icon.role}</div>
        </div>
        <div class="card-back">
          <div class="tagline">${icon.tagline}</div>
        </div>
      </div>
    `;
    
    card.addEventListener('click', () => {
      if (state.icons.includes(icon.name)) {
        state.icons = state.icons.filter(i => i !== icon.name);
      } else if (state.icons.length < 5) {
        state.icons.push(icon.name);
      }
      update();
    });
    
    grid.appendChild(card);
  });
}

// ===== STEP 3: GAME =====
function renderPlayToggle() {
  const container = document.getElementById('playToggle');
  container.innerHTML = '';
  
  ['Yes', 'No', 'Used to'].forEach(option => {
    const toggle = document.createElement('div');
    toggle.className = `toggle ${state.playStatus === option ? 'active' : ''}`;
    toggle.textContent = option;
    
    toggle.addEventListener('click', () => {
      state.playStatus = option;
      document.getElementById('pitch').style.display = option !== 'No' ? 'block' : 'none';
      document.getElementById('selectedPosition').textContent = state.position ? `Position: ${state.position}` : '';
      update();
    });
    
    container.appendChild(toggle);
  });
}

function renderSkills() {
  const container = document.getElementById('skills');
  container.innerHTML = '';
  
  ['Grassroots', 'Amateur', 'Semi-pro', 'Pro'].forEach(skill => {
    const toggle = document.createElement('div');
    toggle.className = `toggle ${state.skill === skill ? 'active' : ''}`;
    toggle.textContent = skill;
    
    toggle.addEventListener('click', () => {
      state.skill = skill;
      update();
    });
    
    container.appendChild(toggle);
  });
}

function setupPitchZones() {
  document.querySelectorAll('.zone').forEach(zone => {
    zone.addEventListener('click', () => {
      state.position = zone.dataset.pos;
      document.querySelectorAll('.zone').forEach(z => z.classList.remove('active'));
      zone.classList.add('active');
      document.getElementById('selectedPosition').textContent = `Position: ${state.position}`;
    });
  });
}

// ===== STEP 4: ERA & STYLES =====
function renderEraSlider() {
  const slider = document.getElementById('eraSlider');
  const text = document.getElementById('eraText');
  
  slider.value = state.era;
  text.textContent = state.era + 's';
  
  slider.addEventListener('input', (e) => {
    state.era = Number(e.target.value);
    text.textContent = state.era + 's';
    updateEraVisual();
  });
}

function renderPlayStyles() {
  const grid = document.getElementById('styles');
  grid.innerHTML = '';
  
  playStyles.forEach(style => {
    const card = document.createElement('div');
    card.className = `card ${state.styles.includes(style) ? 'selected' : ''}`;
    card.textContent = style;
    
    card.addEventListener('click', () => {
      if (state.styles.includes(style)) {
        state.styles = state.styles.filter(s => s !== style);
      } else if (state.styles.length < 2) {
        state.styles.push(style);
      }
      update();
    });
    
    grid.appendChild(card);
  });
}

function updateEraVisual() {
  document.body.className = '';
  if (state.era <= 1980) document.body.classList.add('era-old');
  else if (state.era <= 2000) document.body.classList.add('era-mid');
  else document.body.classList.add('era-modern');
}

// ===== STEP 5: RESULTS =====
function generateRecommendations() {
  let scored = avatars.map(avatar => {
    let score = 0;
    
    if (avatar.positions?.includes(state.position)) score += 3;
    if (avatar.styles?.some(s => state.styles.includes(s))) score += 2;
    if (avatar.clubs?.some(c => state.clubs.includes(c))) score += 2;
    if (avatar.positions?.includes(state.position) && avatar.styles?.some(s => state.styles.includes(s))) score += 2;
    if (state.era >= 2010) score += 1;
    if (avatar.type === 'coach') score -= 1;
    
    return {...avatar, score};
  }).sort((a, b) => b.score - a.score).slice(0, 5);
  
  return scored;
}

function renderResults() {
  const grid = document.getElementById('results');
  grid.innerHTML = '';
  
  generateRecommendations().forEach(avatar => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <strong>${avatar.name}</strong>
      <div style="font-size:14px;color:var(--accent-soft);margin-top:8px;">Score: ${avatar.score}</div>
    `;
    grid.appendChild(card);
  });
}

function renderSummary() {
  const summary = document.getElementById('summary');
  summary.innerHTML = `
    <div style="background:var(--glass-bg);border:1px solid var(--border-soft);border-radius:var(--radius);padding:24px;">
      <div style="margin-bottom:20px;">
        <strong style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.7);">Your Clubs</strong>
        <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;">
          ${state.clubs.map(clubName => {
            const club = clubs.find(c => c.name === clubName);
            return `<span style="background:${club.color};color:#000;padding:8px 16px;border-radius:20px;font-weight:500;">${clubName}</span>`;
          }).join('') || '<span style="color:rgba(255,255,255,0.5);">None selected</span>'}
        </div>
      </div>
      <div style="margin-bottom:20px;">
        <strong style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.7);">Position</strong>
        <div style="margin-top:12px;font-size:18px;color:var(--accent-soft);">${state.position || 'Fan'}</div>
      </div>
      <div style="margin-bottom:20px;">
        <strong style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.7);">Era</strong>
        <div style="margin-top:12px;font-size:18px;color:var(--accent-soft);">${state.era}s</div>
      </div>
      <div>
        <strong style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.7);">Styles</strong>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
          ${state.styles.map(s => `<span style="border:1px solid var(--accent-soft);color:var(--accent-soft);padding:6px 12px;border-radius:16px;font-size:13px;">${s}</span>`).join('') || '<span style="color:rgba(255,255,255,0.5);">None selected</span>'}
        </div>
      </div>
    </div>
  `;
}

function renderPersona() {
  const era = state.era + 's';
  const position = state.position ? state.position.toUpperCase() : 'FAN';
  const style = state.styles[0] || 'MODERN';
  
  document.getElementById('persona').innerHTML = 
    `<div style="font-family:'Bebas Neue';font-size:clamp(32px,6vw,48px);letter-spacing:2px;color:var(--accent);text-shadow:0 4px 16px rgba(0,230,118,0.4);margin-bottom:16px;">
      ${era} ${position} ${style.replace('-', ' ').toLowerCase()} MASTER
    </div>`;
}

// ===== MAIN UPDATE =====
function update() {
  renderClubs();
  renderClubBadges();
  renderIcons();
  renderPlayToggle();
  renderSkills();
  renderEraSlider();
  renderPlayStyles();
  setupPitchZones();
  updateEraVisual();
  
  document.getElementById('selectedPosition').textContent = state.position ? `Position: ${state.position}` : '';
}

// ===== PARTICLES =====
function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  const particles = [];
  
  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 0.5;
      this.speedX = Math.random() * 0.5 - 0.25;
      this.speedY = Math.random() * 0.5 - 0.25;
      this.opacity = Math.random() * 0.5 + 0.2;
    }
    
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      
      if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
      if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
    }
    
    draw() {
      ctx.save();
      ctx.globalAlpha = this.opacity;
      ctx.fillStyle = 'rgba(0, 230, 118, 0.6)';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  
  for (let i = 0; i < 60; i++) {
    particles.push(new Particle());
  }
  
  function animate() {
    ctx.fillStyle = 'rgba(10, 15, 10, 0.1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    
    requestAnimationFrame(animate);
  }
  animate();
  
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  initParticles();
  update();
});
</script>
